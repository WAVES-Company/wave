name: wave
description: "wave of goals"

publish_to: 'none'

version: 1.1.1+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter   
  intl_utils: ^2.8.14
  flutter_inset_shadow: ^2.0.3
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  image_cropper: ^12.2.1
  url_launcher: ^6.3.2
  package_info_plus: ^8.0.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  local_auth: ^3.0.1
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.3
  timezone: ^0.10.1
  flutter_timezone: ^4.0.0
  flutter_svg: ^2.3.0
  share_plus: ^10.0.0 
  supabase_flutter: ^2.14.2
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^7.1.1
  encrypt: ^5.0.3
  cryptography: ^2.3.4
  cryptography_flutter: ^2.3.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/sectionicons/black/
    - assets/icons/sectionicons/white/
    - assets/icons/pageicons/off/
    - assets/icons/pageicons/on/
    - .env

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/NunitoSans-VariableFont_YTLC,opsz,wdth,wght.ttf

  uses-material-design: true
  generate: true

flutter_intl:
  enabled: true
  generate: true
